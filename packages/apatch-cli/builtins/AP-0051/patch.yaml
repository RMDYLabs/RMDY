schema: apatch/v0.1
id: AP-0051
name: tool-loop-circuit-breaker
version: 0.1.0
description: Stops identical no-progress tool calls and forces the agent to re-plan.
runtimes:
  - openai-agents-sdk
  - browser-use
  - custom
trigger:
  type: repeated_tool_call
intervention:
  type: limit_repeated_tool_calls
  threshold: 3
  on_failure: replan
verification:
  fixture: ./cases/regression.json
  minimum_pass_rate: 1
privacy:
  redaction: local_required
