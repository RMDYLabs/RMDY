name: Agent failure report
description: Propose a privacy-safe, reproducible AI-agent failure.
title: "[failure] "
labels: ["failure"]
body:
  - type: markdown
    attributes:
      value: Never paste raw traces, credentials, personal data, or private prompts.
  - type: input
    id: runtime
    attributes:
      label: Runtime
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, personal data, and confidential content.
          required: true
